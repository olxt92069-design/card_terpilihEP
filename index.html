<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b18">
<title>Telepon — Jumlah Klaim</title>
<style>
:root {
  color-scheme: dark;
  --bg:#070b18; --panel:#0a1223; --card:#070d1b; --border:#1b2a43;
  --text:#f4f7fb; --muted:#6d8baa; --cyan:#12d9ed; --blue:#9ac8e8;
  --soft:#111e36; --pink:#ed4c87; --green:#00d5a4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Roboto,"Segoe UI",Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1100px;margin:0 auto;min-height:100vh;padding:0 22px 100px;position:relative}
.statusbar{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;color:#eaf0f7;font-size:14px;font-weight:600}
.status-icons{letter-spacing:2px;font-size:13px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 24px}
h1{font-size:24px;margin:0;font-weight:750;letter-spacing:-.4px}
.time-block{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.time-block strong{font-size:14px;font-weight:650;margin-right:12px}
.clock{display:flex;align-items:center;gap:5px;color:#fff}
.clock span{background:#10182a;border:1px solid #293650;border-radius:6px;padding:8px 9px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:clamp(24px,7vw,84px);padding:0 26px 16px;border-bottom:1px solid #1c2a40;color:var(--muted);font-size:14px}
.tab{border:0;background:none;color:inherit;padding:8px 0 13px;position:relative}
.tab.active{color:var(--cyan);font-weight:700}
.tab.active:after{content:"";height:3px;width:46px;background:var(--cyan);position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-radius:5px}
.tools{display:grid;grid-template-columns:minmax(185px, .75fr) minmax(240px,1.3fr);gap:14px;margin:22px 0 17px}
.secondary-btn,.searchbox{border:1px solid #26334e;background:linear-gradient(120deg,#101c35,#0a1427);border-radius:17px;min-height:64px;color:var(--blue)}
.secondary-btn{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 16px;font-size:14px;font-weight:650}
.pill{border:1px solid var(--pink);color:var(--pink);border-radius:20px;padding:3px 12px;font-size:13px}
.searchbox{display:flex;align-items:center;padding:0 20px;gap:10px}
.searchbox input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:white;font-size:18px}
.searchbox input::placeholder{color:#58728e}
.search-icon{font-size:27px;color:var(--cyan);line-height:1}
.column-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:0 6px 17px;border-bottom:1px solid #1b2a40}
.cards{display:grid;gap:14px;margin-top:17px}
.phone-card{border:1px solid #1e2c45;border-radius:22px;background:rgba(3,8,18,.35);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;position:relative}
.card-left{min-width:0}
.card-right{border-left:1px solid #1c2a42;padding-left:20px}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:7px}
.status{display:inline-flex;align-items:center;gap:6px;border:1px solid #3b526b;background:#142135;border-radius:30px;padding:5px 12px;color:#a9c9e1;font-size:12px;font-weight:600}
.status.done{border-color:#087e70;color:#28e5c0;background:#082b2c}
.editable{border:0;background:transparent;color:var(--cyan);padding:0;text-align:left;max-width:100%;overflow-wrap:anywhere}
.editable:hover{ text-decoration:underline;text-decoration-style:dotted;text-underline-offset:5px}
.phone-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;margin:7px 0 3px}.phone-number{font-size:clamp(16px,2.5vw,21px);font-weight:750;letter-spacing:-.3px;margin:0;display:block;min-width:0;flex:1}.copy-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 34px;border:0;border-radius:9px;background:transparent;color:var(--cyan);padding:0;font-size:0}.copy-btn svg{width:22px;height:22px;display:block}.copy-btn:hover{background:#10223a}.copy-btn:active{transform:scale(.95)}
.subline{color:var(--cyan);font-size:14px;min-height:16px;margin-bottom:9px}
.action-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.whatsapp{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;background:#101e37;border:1px solid #2b3b5e;border-radius:14px;color:#a9d8f2;text-decoration:none;font-size:13px;font-weight:650}
.action-row .copy-btn{display:none}
.claim-box{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 11px;border:1px solid #1b3555;border-radius:14px;background:linear-gradient(110deg,#0d1b31,#081222);min-width:0}
.claim-icon{color:#8fd4f6;font-size:24px;flex-shrink:0}
.claim-details{min-width:0;flex:1}
.claim-label{color:var(--muted);font-size:14px;margin-bottom:3px}
.claim-value{display:inline-block;font-size:clamp(18px,2.5vw,23px);font-weight:800;letter-spacing:.2px;font-variant-numeric:tabular-nums;line-height:1.1}
.claim-hint{display:none!important}
.chevron{color:#9bd4f4;font-size:26px}
.result-title{color:var(--muted);font-size:13px;margin:0 0 13px}
.check-list{display:grid;gap:16px}
.check-item{display:flex;align-items:center;gap:11px;color:#dce7f1;font-size:14px}
.check-item input{appearance:none;width:22px;height:22px;border:2px solid #547da0;border-radius:6px;margin:0;flex-shrink:0;background:transparent;position:relative}
.check-item input:checked{background:var(--cyan);border-color:var(--cyan)}
.check-item input:checked:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#06202c;font-weight:900;font-size:16px}
.check-item input:disabled{opacity:.85}
.empty{border:1px dashed #24334b;border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
.bottom-nav{position:fixed;z-index:5;bottom:0;left:0;right:0;background:rgba(5,10,22,.96);border-top:1px solid #1b2a40;display:flex;justify-content:center;gap:clamp(25px,12vw,130px);padding:13px 12px 17px;backdrop-filter:blur(12px)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;color:#6485a4;font-size:12px;min-width:55px}
.nav-icon{font-size:26px;line-height:1}
.nav-item.active{color:var(--cyan);font-weight:700}
.nav-item.active .nav-icon{background:#10233f;border-radius:30px;padding:5px 18px}
.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#102b3b;color:#baf8ff;border:1px solid #176274;border-radius:12px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
.toast.show{opacity:1}
.dialog-backdrop{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
.dialog-backdrop.show{display:flex}
.dialog{width:min(440px,100%);background:#0b1426;border:1px solid #293a57;border-radius:20px;padding:22px;box-shadow:0 20px 60px #0008}
.dialog h2{font-size:19px;margin:0 0 7px}
.dialog p{color:var(--muted);font-size:13px;margin:0 0 17px}
.dialog input{width:100%;background:#060c19;border:1px solid #2a3c59;border-radius:11px;padding:13px;color:white;outline:none}
.dialog input:focus{border-color:var(--cyan)}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.dialog-actions button{border-radius:10px;padding:10px 15px;border:1px solid #293b56;background:#111e33;color:#c6d8e8}
.dialog-actions .save{background:var(--cyan);color:#05212b;border-color:var(--cyan);font-weight:750}
@media(max-width:600px){
 .app{padding:0 13px 100px}
 .statusbar{height:38px}
 h1{font-size:21px}
 .topline{align-items:flex-start;flex-direction:column;margin:9px 0 18px}
 .time-block{width:100%;justify-content:space-between}
 .time-block strong{margin-right:auto}
 .tabs{gap:clamp(18px,7vw,45px);padding-left:10px;font-size:12px}
 .tools{grid-template-columns:minmax(0,.8fr) minmax(0,1.35fr);gap:10px;margin-top:17px}
 .secondary-btn{min-height:57px;padding:9px 8px;gap:7px;font-size:12px;border-radius:14px}
 .searchbox{min-height:57px;padding:0 13px;border-radius:14px}
 .searchbox input{font-size:16px}
 .column-labels{padding-bottom:13px}
 .phone-card{padding:12px 11px;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:10px;border-radius:20px}
 .card-right{padding-left:11px}
 .card-meta{align-items:flex-start;flex-direction:column;gap:8px;font-size:12px}
 .phone-number{font-size:16px;line-height:1.25}.phone-row{gap:4px}.copy-btn{width:30px;height:30px;flex-basis:30px}.copy-btn svg{width:20px;height:20px}
 .whatsapp{padding:8px 9px;font-size:11px;gap:5px}
 .copy-btn{font-size:20px}
 .claim-box{gap:7px;padding:8px 7px;margin-top:9px;border-radius:13px}
 .claim-icon{font-size:20px}
 .claim-label{font-size:12px}
 .claim-value{font-size:clamp(16px,4.3vw,20px)}
 .claim-hint{font-size:10px}
 .result-title{font-size:13px;margin-bottom:18px}
 .check-list{gap:16px}
 .check-item{font-size:12px;gap:7px;align-items:flex-start;line-height:1.4}
 .check-item input{width:20px;height:20px}
 .bottom-nav{justify-content:space-around;gap:0;padding-bottom:15px}
}
@media(max-width:370px){
 .phone-card{grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:8px;padding:10px 8px}
 .card-right{border-left:1px solid #1c2a42;border-top:0;padding:0 0 0 8px}
 .card-meta{flex-direction:column;align-items:flex-start;gap:5px}
 .check-list{grid-template-columns:1fr;gap:13px}
 .check-item{font-size:11px;gap:5px}
 .check-item input{width:17px;height:17px}
 .claim-value{font-size:16px}
 .claim-icon{display:none}
 .claim-box{gap:4px;padding:7px 6px}
 .chevron{font-size:18px}
}

/* Mode card saja: sembunyikan header/menu/filter, fokus ke kartu nomor dan klaim */
body{background:#070b18}
.app.card-only{max-width:760px;min-height:100vh;padding:18px 14px 28px;margin:0 auto}
.cards{gap:10px;margin-top:0}
.phone-card{padding:13px 14px;border-radius:18px}
.add-card{display:block;width:100%;margin:12px 0 0;border:1px dashed #29415e;border-radius:14px;padding:12px;background:#0a1427;color:#8ccfe9;font-weight:650}
@media(min-width:650px){.app.card-only{padding-top:28px}.phone-card{padding:16px 18px}}
@media(max-width:370px){.app.card-only{padding:10px 8px}.phone-card{padding:9px 8px}}
</style>
</head>
<body>
<div class="app card-only">
  <main class="cards" id="cards"></main>
  <button class="add-card" id="addCard" type="button">＋ Tambah nomor</button>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="dialog-backdrop" id="dialogBackdrop" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <form class="dialog" id="editForm">
    <h2 id="dialogTitle">Edit data</h2>
    <p id="dialogDescription">Ubah nilai lalu tekan Simpan.</p>
    <input id="editInput" autocomplete="off" required>
    <div class="dialog-actions"><button type="button" id="cancelEdit">Batal</button><button type="submit" class="save">Simpan</button></div>
  </form>
</div>
<script>
(() => {
  const STORAGE_KEY = 'telepon-claim-cards-v1';
  const starter = [{
    id: 1, phone: '6285392178446', name: '-', claim: '1.200.000',
    done: true, registered: true, read: true, replied: true
  }];
  let records;
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    records = saved === null ? starter : JSON.parse(saved);
    if (!Array.isArray(records)) records = starter;
  } catch { records = starter; }
  let currentFilter = 'all';
  let editTarget = null;

  const cards = document.getElementById('cards');
  const searchInput = document.getElementById('searchInput');
  const backdrop = document.getElementById('dialogBackdrop');
  const editForm = document.getElementById('editForm');
  const editInput = document.getElementById('editInput');
  const toast = document.getElementById('toast');

  function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
  // Simpan nomor hanya sebagai angka: +62 821-4817-8335 -> 6282148178335
  function normalizePhone(value){ return String(value ?? '').replace(/\D/g, ''); }
  function escapeHTML(value){
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function showToast(message){
    toast.textContent = message; toast.classList.add('show');
    clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  function render(){
    const visible = records;
    
    
    
    

    if(!visible.length){
      cards.innerHTML = '';
      return;
    }
    cards.innerHTML = visible.map((r, index) => `
      <article class="phone-card" data-id="${r.id}">
        <section class="card-left">
          <div class="card-meta"><span>#${index+1}</span><span class="status ${r.done?'done':''}">${r.done?'✓ ':''}${r.done?'Terpilih':'Belum Terpilih'}</span></div>
          <div class="phone-row">
            <button class="editable phone-number" data-edit="phone" title="Klik untuk mengedit nomor WhatsApp">${escapeHTML(r.phone || 'Klik untuk isi nomor')}</button>
            <button class="copy-btn" data-action="copy" title="Salin nomor WhatsApp" aria-label="Salin nomor">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="7" width="12" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
          </div>
          <div class="subline"><button class="editable" data-edit="name" title="Klik untuk mengedit nama">${escapeHTML(r.name || '-')}</button></div>
          <div class="action-row">
            <a class="whatsapp" href="https://wa.me/${encodeURIComponent(String(r.phone||'').replace(/\\D/g,''))}" target="_blank" rel="noopener">☏ WhatsApp ↗</a>
          </div>
          <button class="claim-box editable" data-edit="claim" title="Klik untuk mengedit jumlah klaim" style="width:100%;text-align:left">
            <span class="claim-icon">▤</span><span class="claim-details"><span class="claim-label" style="display:block">Jumlah Klaim</span><span class="claim-value">${escapeHTML(r.claim || '0')}</span><span class="claim-hint" style="display:block">Ketuk angka untuk edit</span></span><span class="chevron">›</span>
          </button>
        </section>
        <section class="card-right">
          <p class="result-title">Hasil</p>
          <div class="check-list">
            <label class="check-item"><input type="checkbox" data-check="unregistered" ${!r.registered?'checked':''}> WA Belum Terdaftar</label>
            <label class="check-item"><input type="checkbox" data-check="registered" ${r.registered?'checked':''}> WA Terdaftar</label>
            <label class="check-item"><input type="checkbox" data-check="read" ${r.read?'checked':''}> Dibaca</label>
            <label class="check-item"><input type="checkbox" data-check="replied" ${r.replied?'checked':''}> Dibalas</label>
          </div>
        </section>
      </article>`).join('');
  }
  function openEdit(record, field){
    editTarget = {id:record.id, field};
    const labels = {phone:'Nomor WhatsApp', claim:'Jumlah Klaim', name:'Nama / keterangan'};
    document.getElementById('dialogTitle').textContent = 'Edit ' + labels[field];
    document.getElementById('dialogDescription').textContent = field === 'claim' ? 'Masukkan jumlah klaim, misalnya 1.200.000.' : field === 'phone' ? 'Masukkan nomor WhatsApp dengan kode negara jika perlu.' : 'Masukkan nama atau keterangan nomor ini.';
    editInput.value = field === 'phone' ? normalizePhone(record[field] ?? '') : (record[field] ?? '');
    editInput.inputMode = field === 'phone' || field === 'claim' ? 'numeric' : 'text';
    editInput.placeholder = field === 'phone' ? '+62 821-4817-8335' : field === 'claim' ? '1.200.000' : 'Nama / keterangan';
    backdrop.classList.add('show'); setTimeout(()=>editInput.focus(),50);
  }
  function closeEdit(){ backdrop.classList.remove('show'); editTarget=null; }
  
function formatJumlahKlaim(value) {
  const angka = value.replace(/\D/g, '');

  if (angka === '') return '';

  return Number(angka).toLocaleString('id-ID');
}

editInput.addEventListener('input', () => {
  if (!editTarget || editTarget.field !== 'claim') return;

  const posisi = editInput.selectionStart;
  const sebelum = editInput.value;

  editInput.value = formatJumlahKlaim(sebelum);

  const selisih = editInput.value.length - sebelum.length;
  const posisiBaru = Math.max(
    0,
    Math.min(
      editInput.value.length,
      (posisi ?? editInput.value.length) + selisih
    )
  );

  editInput.setSelectionRange(posisiBaru, posisiBaru);
});

  editInput.addEventListener('input', () => {
    if(editTarget?.field === 'phone'){
      const normalized = normalizePhone(editInput.value);
      if(editInput.value !== normalized) editInput.value = normalized;
    }
  });
  editForm.addEventListener('submit', e => {
    e.preventDefault(); if(!editTarget) return;
    const record = records.find(r=>r.id===editTarget.id); if(!record) return;
    let value = editInput.value.trim();
    if(editTarget.field === 'phone') value = normalizePhone(value);
    record[editTarget.field] = value;
    persist(); closeEdit(); render(); showToast('Perubahan berhasil disimpan');
  });
  document.getElementById('cancelEdit').addEventListener('click', closeEdit);
  backdrop.addEventListener('click', e=>{if(e.target===backdrop) closeEdit();});
  document.addEventListener('keydown', e=>{if(e.key==='Escape') closeEdit();});
  cards.addEventListener('click', async e=>{
    const card = e.target.closest('.phone-card'); if(!card) return;
    const record = records.find(r=>String(r.id)===card.dataset.id); if(!record) return;
    const editButton = e.target.closest('[data-edit]');
    if(editButton){ openEdit(record, editButton.dataset.edit); return; }
    const copyButton = e.target.closest('[data-action="copy"]');
    if(copyButton){
      try { await navigator.clipboard.writeText(String(record.phone||'')); showToast('Nomor berhasil disalin'); }
      catch { const ta=document.createElement('textarea'); ta.value=record.phone||''; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); showToast('Nomor berhasil disalin'); }
    }
  });
  cards.addEventListener('change', e=>{
    const card=e.target.closest('.phone-card'); if(!card || !e.target.matches('[data-check]')) return;
    const record=records.find(r=>String(r.id)===card.dataset.id); if(!record) return;
    const field=e.target.dataset.check;
    if(field==='unregistered'){record.registered=!e.target.checked;}
    else if(field==='registered'){record.registered=e.target.checked;}
    else record[field]=e.target.checked;
    record.done=!!(record.registered && record.read && record.replied);
    persist(); render();
  });
  document.getElementById('addCard').addEventListener('click', addRecord);
  function addRecord(){
    const id=records.reduce((max,r)=>Math.max(max,Number(r.id)||0),0)+1;
    const record={id,phone:'',name:'-',claim:'0',done:false,registered:false,read:false,replied:false,follow:false};
    records.push(record); persist(); render(); openEdit(record,'phone');
  }
  render();
})();
</script>
</body>
</html>
